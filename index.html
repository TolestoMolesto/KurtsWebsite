<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes, maximum-scale=5">
    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Smite Source 2">
    <title>Smite Source 2 - Builder & Calculator</title>
    <meta name="description" content="Ultimate Smite 2 companion tool. Build optimizer, god calculator, and item browser.">
    
    <!-- Preconnect to external resources for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
    
    <!-- Fonts with display=swap for better LCP -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'mythic-gold': '#FACC15', // yellow-400
              'mythic-accent': '#EAB308', // yellow-500
              'mythic-700': '#A16207', // yellow-700
              'mythic-900': '#713F12', // yellow-900
            },
            fontFamily: {
              serif: ['Cinzel', 'serif'],
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <!-- Import Map -->
    <script type="importmap">
    {
      "imports": {
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
        "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
        "firebase/": "https://aistudiocdn.com/firebase@^12.6.0/"
      }
    }
    </script>

    <style>
      /* Ensure fixed header doesn't block content when scrolling to elements */
      html {
        scroll-padding-top: 120px;
      }

      @media (max-width: 768px) {
        html {
          scroll-padding-top: 80px;
        }
      }

      /* Safe area for mobile bottom nav (notched phones) */
      .safe-area-bottom {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      /* Skeleton shimmer animation */
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      
      .animate-shimmer {
        animation: shimmer 1.5s ease-in-out infinite;
        background: linear-gradient(90deg, #27272a 25%, #3f3f46 50%, #27272a 75%);
        background-size: 200% 100%;
      }

      /* Slow bounce for holiday decorations */
      @keyframes bounce-slow {
        0%, 100% { transform: translateY(0) rotate(-15deg); }
        50% { transform: translateY(-5px) rotate(-15deg); }
      }
      
      .animate-bounce-slow {
        animation: bounce-slow 2s ease-in-out infinite;
      }

      /* Pulse slow for ambient effects */
      @keyframes pulse-slow {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
      
      .animate-pulse-slow {
        animation: pulse-slow 3s ease-in-out infinite;
      }

      /* Animate-in utilities (if not using Tailwind plugin) */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      @keyframes slideInFromBottom {
        from { transform: translateY(8px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      
      @keyframes slideInFromTop {
        from { transform: translateY(-8px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }

      @keyframes shimmer {
       0% { transform: translateX(-100%) skewX(-12deg); }
       100% { transform: translateX(200%) skewX(-12deg); }
      }
      
      .animate-in {
        animation-duration: 300ms;
        animation-fill-mode: both;
      }
      
      .fade-in {
        animation-name: fadeIn;
      }
      
      .slide-in-from-bottom-2 {
        animation-name: slideInFromBottom;
      }
      
      .slide-in-from-top-2 {
        animation-name: slideInFromTop;
      }
      
      .duration-500 {
        animation-duration: 500ms;
      }
      
      .duration-300 {
        animation-duration: 300ms;
      }
      
      .duration-200 {
        animation-duration: 200ms;
      }

      /* Hide scrollbar but keep functionality */
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      /* Focus visible for accessibility */
      button:focus-visible,
      a:focus-visible,
      input:focus-visible {
        outline: 2px solid #FACC15;
        outline-offset: 2px;
      }

      /* Custom Hexagon Clip Path */
      .clip-hexagon {
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      }

      /* Holiday Card Glow Effects */
      @keyframes holiday-glow {
        0%, 100% {
          box-shadow: 0 0 10px rgba(250, 204, 21, 0.1), 0 0 20px rgba(250, 204, 21, 0.05);
        }
        50% {
          box-shadow: 0 0 15px rgba(250, 204, 21, 0.2), 0 0 30px rgba(250, 204, 21, 0.1);
        }
      }

      .holiday-card-glow {
        animation: holiday-glow 3s ease-in-out infinite;
      }

      /* Festive shimmer effect for special elements */
      @keyframes festive-shimmer {
        0% {
          background-position: -100% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }

      .festive-shimmer {
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 223, 0, 0.1) 25%,
          rgba(250, 204, 21, 0.2) 50%,
          rgba(255, 223, 0, 0.1) 75%,
          transparent 100%
        );
        background-size: 200% 100%;
        animation: festive-shimmer 4s linear infinite;
      }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
