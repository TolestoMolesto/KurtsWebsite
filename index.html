<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Smite Source 2</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'mythic-gold': '#FACC15', // yellow-400
              'mythic-accent': '#EAB308', // yellow-500
              'mythic-700': '#A16207', // yellow-700
              'mythic-900': '#713F12', // yellow-900
            },
            fontFamily: {
              serif: ['Cinzel', 'serif'],
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <!-- Import Map -->
    <script type="importmap">
    {
      "imports": {
        "react/": "https://aistudiocdn.com/react@^19.2.0/",
        "react": "https://aistudiocdn.com/react@^19.2.0",
        "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0",
        "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
        "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
        "firebase/": "https://aistudiocdn.com/firebase@^12.6.0/"
      }
    }
    </script>

    <style>
      /* Safe area for mobile bottom nav (notched phones) */
      .safe-area-bottom {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      /* Skeleton shimmer animation */
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      
      .animate-shimmer {
        animation: shimmer 1.5s ease-in-out infinite;
        background: linear-gradient(90deg, #27272a 25%, #3f3f46 50%, #27272a 75%);
        background-size: 200% 100%;
      }

      /* Slow bounce for holiday decorations */
      @keyframes bounce-slow {
        0%, 100% { transform: translateY(0) rotate(-15deg); }
        50% { transform: translateY(-5px) rotate(-15deg); }
      }
      
      .animate-bounce-slow {
        animation: bounce-slow 2s ease-in-out infinite;
      }

      /* Pulse slow for ambient effects */
      @keyframes pulse-slow {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.7; }
      }
      
      .animate-pulse-slow {
        animation: pulse-slow 3s ease-in-out infinite;
      }

      /* Animate-in utilities (if not using Tailwind plugin) */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      
      @keyframes slideInFromBottom {
        from { transform: translateY(8px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      
      @keyframes slideInFromTop {
        from { transform: translateY(-8px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      
      .animate-in {
        animation-duration: 300ms;
        animation-fill-mode: both;
      }
      
      .fade-in {
        animation-name: fadeIn;
      }
      
      .slide-in-from-bottom-2 {
        animation-name: slideInFromBottom;
      }
      
      .slide-in-from-top-2 {
        animation-name: slideInFromTop;
      }
      
      .duration-500 {
        animation-duration: 500ms;
      }
      
      .duration-300 {
        animation-duration: 300ms;
      }
      
      .duration-200 {
        animation-duration: 200ms;
      }

      /* Hide scrollbar but keep functionality */
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }

      /* Focus visible for accessibility */
      button:focus-visible,
      a:focus-visible,
      input:focus-visible {
        outline: 2px solid #FACC15;
        outline-offset: 2px;
      }

      /* Custom Hexagon Clip Path */
      .clip-hexagon {
        clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
